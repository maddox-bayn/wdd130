<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <!-- Wrapper keeps title and quiz container aligned together in the middle -->
    <div class="quiz-wrapper">

        <!-- Valid H1 heading appropriate for the content -->
        <h1>Basic HTML and CSS Quiz</h1>

        <!-- Main Quiz Form Area -->
        <form class="quiz-container">

            <!-- Question 1: Text type input -->
            <div class="question-group">
                <label class="question-label" for="q1">
                    <span class="q-num">1.</span> What does the acronym CSS stand for?
                </label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <!-- Question 2: Textarea element -->
            <div class="question-group">
                <label class="question-label" for="q2">
                    <span class="q-num">2.</span> Briefly explain the difference between a class and
                    an ID selector in CSS.
                </label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>

            <!-- Question 3: Select element with non-selectable default option -->
            <div class="question-group">
                <label class="question-label" for="q3">
                    <span class="q-num">3.</span> Which element is used to link an external CSS
                    stylesheet file to an HTML document?
                </label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="link">&lt;link&gt;</option>
                    <option value="style">&lt;style&gt;</option>
                    <option value="script">&lt;script&gt;</option>
                </select>
            </div>

            <!-- Question 4: Number type input with a code snippet wrapper -->
            <div class="question-group">
                <label class="question-label" for="q4">
                    <span class="q-num">4.</span> What is the bottom margin size in pixels given
                    this shorthand CSS declaration?
                </label>

                <div class="code-box">
                    margin: 10px 5px 15px;
                </div>

                <input type="number" id="q4" name="q4" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit Quiz</button>

        </form>

    </div>

</body>

</html>
