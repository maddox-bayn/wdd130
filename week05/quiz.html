<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz</title>
    <!-- Links to the external CSS file -->
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <!-- Quiz Title Header Area -->
    <div class="quiz-title">
        <span>☑</span> Basic HTML and CSS Quiz
    </div>

    <!-- Main Quiz Form Area -->
    <form class="quiz-container">

        <!-- Question 1 -->
        <div class="question-group">
            <label class="question-label" for="q1">
                <span class="q-num">1.</span> What does the acronym CSS stand for?
            </label>
            <input type="text" id="q1" name="q1">
        </div>

        <!-- Question 2 -->
        <div class="question-group">
            <label class="question-label" for="q2">
                <span class="q-num">2.</span> How are id and class attributes selected in CSS?
            </label>
            <textarea id="q2" name="q2"></textarea>
        </div>

        <!-- Question 3 -->
        <div class="question-group">
            <label class="question-label" for="q3">
                <span class="q-num">3.</span> Which of the following is a valid CSS comment?
            </label>
            <select id="q3" name="q3">
                <option value="">Choose One ...</option>
            </select>
        </div>

        <!-- Question 4 -->
        <div class="question-group">
            <label class="question-label" for="q4">
                <span class="q-num">4.</span> What is the bottom margin given this declaration?
            </label>

            <!-- Code block presentation matching the gray container -->
            <div class="code-box">
                margin: 10px 5px 15px;
            </div>

            <input type="text" id="q4" name="q4">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">Submit Quiz</button>

    </form>

</body>

</html>
